<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/pwa-icon.png">
  <meta name="theme-color" content="#2a5299">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SIGERD WEB</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet">
  <script>
    window.onerror = function (msg, url, line, col, error) {
      // Log técnico no console (visível apenas para devs no DevTools)
      console.error('[SIGERD Erro Global]', { msg, url, line, col, error });
      // Suprime o diálogo/comportamento de erro padrão do browser
      return true;
    };
    window.onunhandledrejection = function (event) {
      // Captura Promises rejeitadas não tratadas
      console.error('[SIGERD Promise]', event.reason);
      return true;
    };
    if (!window.L) window.L = {};

    // NUCLEAR CACHE RESET 
    (async function () {
      const TARGET_VERSION = '1.01.18';
      if (localStorage.getItem('app_version') !== TARGET_VERSION) {
        console.log("Nuclear Reset Triggered: Version Mismatch");
        if ('serviceWorker' in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          for (let r of regs) await r.unregister();
        }
        if ('caches' in window) {
          const keys = await caches.keys();
          for (let k of keys) await caches.delete(k);
        }
        localStorage.setItem('app_version', TARGET_VERSION);
        window.location.reload(true);
      }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
